<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3f6f8f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="月間みえる記録">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>月間みえる記録</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --text:#222; --muted:#70757d;
    --line:#dfe3e8; --accent:#3f6f8f; --accent2:#e8f1f6;
    --money:#7b4d88; --money2:#f3eaf6; --danger:#b14d4d;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
  .app{max-width:980px;margin:0 auto;padding:18px}
  h1{font-size:1.45rem;margin:0 0 14px}
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .toolbar button,.action{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
  .month{font-size:1.2rem;font-weight:800}
  .calendar{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .weekdays,.grid{display:grid;grid-template-columns:repeat(7,1fr)}
  .weekdays div{padding:10px;text-align:center;font-size:.85rem;color:var(--muted);border-bottom:1px solid var(--line)}
  .day{min-height:112px;padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;background:#fff}
  .day:nth-child(7n){border-right:none}
  .day.empty{background:#fafafa;cursor:default}
  .date{font-weight:800;margin-bottom:6px}
  .tags{display:flex;flex-wrap:wrap;gap:4px}
  .tag{font-size:.72rem;border-radius:999px;padding:3px 6px;background:var(--accent2);color:var(--accent)}
  .icon-tag{font-size:1rem;line-height:1;padding:4px;background:transparent}
  .tag.money.icon-tag{background:transparent}
  .tag.money{background:var(--money2);color:var(--money)}
  .sum{margin-top:6px;font-size:.75rem;color:var(--muted)}
  .summary{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
  .card h2{font-size:1rem;margin:0 0 10px}
  .stats{display:grid;grid-template-columns:1fr auto;gap:8px 14px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;align-items:center;justify-content:center;padding:18px}
  .modal.open{display:flex}
  .dialog{width:min(560px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:18px}
  .dialog h2{margin:0 0 14px}
  .section{margin:16px 0}
  .section h3{font-size:1rem;margin:0 0 9px}
  .choices{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
  .choice{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-weight:800;cursor:pointer}
  .choice.active.food{background:var(--accent2);border-color:var(--accent);color:var(--accent)}
  .choice.active.money{background:var(--money2);border-color:var(--money);color:var(--money)}
  .amounts{display:grid;gap:10px;margin-top:12px}
  .amount-row{display:grid;grid-template-columns:100px 1fr;align-items:center;gap:10px}
  input[type="number"]{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:1rem}
  .dialog-actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  .danger{color:var(--danger)}
  .primary{background:var(--accent)!important;color:#fff!important;border-color:var(--accent)!important}
  .note{font-size:.82rem;color:var(--muted)}
  @media(max-width:700px){
    .app{padding:10px}
    .day{min-height:82px;padding:5px}
    .tag{font-size:.62rem;padding:2px 4px}.icon-tag{font-size:.9rem;padding:2px}
    .summary{grid-template-columns:1fr}
    .weekdays div{padding:7px 2px}
    .month{font-size:1rem}
  }
</style>
</head>
<body>
<div class="app">
  <h1>月間みえる記録</h1>
  <div class="toolbar">
    <button id="prev">＜ 前月</button>
    <div class="month" id="monthLabel"></div>
    <button id="next">翌月 ＞</button>
  </div>

  <div class="calendar">
    <div class="weekdays">
      <div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>
    </div>
    <div class="grid" id="calendarGrid"></div>
  </div>

  <div class="summary">
    <div class="card">
      <h2>食事コマンド</h2>
      <div class="stats" id="foodStats"></div>
    </div>
    <div class="card">
      <h2>お金コマンド</h2>
      <div class="stats" id="moneyStats"></div>
    </div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="dialog">
    <h2 id="dialogTitle"></h2>

    <div class="section">
      <h3>食事コマンド</h3>
      <div class="choices" id="foodChoices"></div>
    </div>

    <div class="section">
      <h3>お金コマンド</h3>
      <div class="choices" id="moneyChoices"></div>
      <div class="amounts" id="amountFields"></div>
    </div>

    <p class="note">同じ日に複数選択できます。お金コマンドは金額を入力してください。</p>

    <div class="dialog-actions">
      <button class="action danger" id="deleteBtn">この日の記録を削除</button>
      <div>
        <button class="action" id="cancelBtn">閉じる</button>
        <button class="action primary" id="saveBtn">保存</button>
      </div>
    </div>
  </div>
</div>

<script>
const FOOD = ["こってり","ドカ食い","大盛り","夜食"];
const MONEY = ["シーシャ","メンコン","Uber"];

const FOOD_ICONS = {
  "こってり": "🍜",
  "ドカ食い": "🍚",
  "大盛り": "⬆️",
  "夜食": "🌙"
};

const MONEY_ICONS = {
  "シーシャ": "💨",
  "メンコン": "🥂",
  "Uber": "🛵"
};
const STORAGE_KEY = "monthly-visible-log-v1";

let current = new Date();
current.setDate(1);
let selectedDate = null;
let draft = null;

function loadData(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch { return {}; }
}
function saveData(data){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}
function keyFor(y,m,d){
  return `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
}
function yen(n){ return new Intl.NumberFormat("ja-JP").format(n) + "円"; }

function renderCalendar(){
  const data = loadData();
  const y = current.getFullYear();
  const m = current.getMonth();
  document.getElementById("monthLabel").textContent = `${y}年${m+1}月`;

  const grid = document.getElementById("calendarGrid");
  grid.innerHTML = "";

  const firstDay = new Date(y,m,1).getDay();
  const days = new Date(y,m+1,0).getDate();

  for(let i=0;i<firstDay;i++){
    const cell = document.createElement("div");
    cell.className = "day empty";
    grid.appendChild(cell);
  }

  for(let d=1;d<=days;d++){
    const k = keyFor(y,m,d);
    const rec = data[k];
    const cell = document.createElement("div");
    cell.className = "day";
    cell.innerHTML = `<div class="date">${d}</div><div class="tags"></div><div class="sum"></div>`;
    const tags = cell.querySelector(".tags");

    if(rec){
      (rec.food || []).forEach(x=>{
        const span=document.createElement("span");
        span.className="tag icon-tag";
        span.textContent=FOOD_ICONS[x] || "•";
        span.title=x;
        span.setAttribute("aria-label", x);
        tags.appendChild(span);
      });
      MONEY.forEach(x=>{
        const amount = Number(rec.money?.[x] || 0);
        if(amount>0){
          const span=document.createElement("span");
          span.className="tag money icon-tag";
          span.textContent=MONEY_ICONS[x] || "¥";
          span.title=x;
          span.setAttribute("aria-label", x);
          tags.appendChild(span);
        }
      });
      const total = MONEY.reduce((s,x)=>s+Number(rec.money?.[x]||0),0);
      if(total>0) cell.querySelector(".sum").textContent = yen(total);
    }
    cell.addEventListener("click",()=>openDialog(y,m,d));
    grid.appendChild(cell);
  }

  renderSummary(y,m,data);
}

function renderSummary(y,m,data){
  const foodCount = Object.fromEntries(FOOD.map(x=>[x,0]));
  const moneyCount = Object.fromEntries(MONEY.map(x=>[x,0]));
  const moneyTotal = Object.fromEntries(MONEY.map(x=>[x,0]));

  Object.entries(data).forEach(([k,rec])=>{
    if(!k.startsWith(`${y}-${String(m+1).padStart(2,"0")}-`)) return;
    (rec.food||[]).forEach(x=>{ if(x in foodCount) foodCount[x]++; });
    MONEY.forEach(x=>{
      const amount=Number(rec.money?.[x]||0);
      if(amount>0){ moneyCount[x]++; moneyTotal[x]+=amount; }
    });
  });

  const fs=document.getElementById("foodStats");
  fs.innerHTML=FOOD.map(x=>`<div>${x}</div><div>${foodCount[x]}日</div>`).join("");

  const ms=document.getElementById("moneyStats");
  ms.innerHTML=MONEY.map(x=>`<div>${x}</div><div>${moneyCount[x]}回・${yen(moneyTotal[x])}</div>`).join("");
}

function openDialog(y,m,d){
  selectedDate = keyFor(y,m,d);
  const data=loadData();
  const rec=data[selectedDate] || {food:[],money:{}};
  draft={food:[...(rec.food||[])],money:{...(rec.money||{})}};

  document.getElementById("dialogTitle").textContent=`${y}年${m+1}月${d}日`;
  renderDialog();
  document.getElementById("modal").classList.add("open");
}

function renderDialog(){
  const fc=document.getElementById("foodChoices");
  fc.innerHTML="";
  FOOD.forEach(x=>{
    const b=document.createElement("button");
    b.className="choice food"+(draft.food.includes(x)?" active":"");
    b.textContent=x;
    b.onclick=()=>{
      draft.food=draft.food.includes(x)?draft.food.filter(v=>v!==x):[...draft.food,x];
      renderDialog();
    };
    fc.appendChild(b);
  });

  const mc=document.getElementById("moneyChoices");
  mc.innerHTML="";
  MONEY.forEach(x=>{
    const active=Number(draft.money[x]||0)>0 || Object.prototype.hasOwnProperty.call(draft.money,x);
    const b=document.createElement("button");
    b.className="choice money"+(active?" active":"");
    b.textContent=x;
    b.onclick=()=>{
      if(active) delete draft.money[x];
      else draft.money[x]="";
      renderDialog();
    };
    mc.appendChild(b);
  });

  const af=document.getElementById("amountFields");
  af.innerHTML="";
  MONEY.forEach(x=>{
    if(!Object.prototype.hasOwnProperty.call(draft.money,x)) return;
    const row=document.createElement("div");
    row.className="amount-row";
    row.innerHTML=`<label>${x}</label><input type="number" min="0" inputmode="numeric" placeholder="金額" value="${draft.money[x] ?? ""}">`;
    row.querySelector("input").addEventListener("input",e=>draft.money[x]=e.target.value);
    af.appendChild(row);
  });
}

document.getElementById("prev").onclick=()=>{ current.setMonth(current.getMonth()-1); renderCalendar(); };
document.getElementById("next").onclick=()=>{ current.setMonth(current.getMonth()+1); renderCalendar(); };
document.getElementById("cancelBtn").onclick=()=>document.getElementById("modal").classList.remove("open");
document.getElementById("modal").addEventListener("click",e=>{ if(e.target.id==="modal") e.currentTarget.classList.remove("open"); });

document.getElementById("saveBtn").onclick=()=>{
  const data=loadData();
  const cleanedMoney={};
  MONEY.forEach(x=>{
    if(Object.prototype.hasOwnProperty.call(draft.money,x)){
      const n=Number(draft.money[x]||0);
      if(n>0) cleanedMoney[x]=n;
    }
  });
  if(draft.food.length===0 && Object.keys(cleanedMoney).length===0) delete data[selectedDate];
  else data[selectedDate]={food:draft.food,money:cleanedMoney};
  saveData(data);
  document.getElementById("modal").classList.remove("open");
  renderCalendar();
};

document.getElementById("deleteBtn").onclick=()=>{
  const data=loadData();
  delete data[selectedDate];
  saveData(data);
  document.getElementById("modal").classList.remove("open");
  renderCalendar();
};

renderCalendar();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(console.error);
  });
}
</script>
</body>
</html>
